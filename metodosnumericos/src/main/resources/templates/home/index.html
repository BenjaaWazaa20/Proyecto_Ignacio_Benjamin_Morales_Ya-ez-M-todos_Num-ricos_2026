<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragments/base :: html(content=~{::section})}">
<body>
    <section>
        <div class="p-5 mb-4 bg-light rounded-3 border">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold" th:text="${titulo}">Bienvenido</h1>
