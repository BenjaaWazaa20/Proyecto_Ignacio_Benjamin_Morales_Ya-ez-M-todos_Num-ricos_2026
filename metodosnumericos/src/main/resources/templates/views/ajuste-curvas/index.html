<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Ajuste de Curvas — Numérica</title></head>
<body>
<section class="container">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
    <div>
      <div class="section-kicker mb-2"><i class="bi bi-bezier2"></i> Unidad IV</div>
      <h2 class="section-title mb-1" style="font-size:1.5rem;">Ajuste de Curvas</h2>
      <p class="section-desc mb-0">Regresión por mínimos cuadrados e interpolación polinomial.</p>
    </div>
    <a th:href="@{/}" class="btn btn-numerica btn-ghost"><i class="bi bi-arrow-left"></i> Inicio</a>
  </div>

  <div class="card-numerica">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <div class="p-3 rounded-3 h-100" style="border:1px solid var(--line);">
            <strong class="d-block mb-1"><i class="bi bi-diagram-2 me-1" style="color:var(--muted);"></i> Regresión</strong>
            <small class="d-block mb-3" style="color:var(--muted);">Mínimos cuadrados</small>
            <div class="d-flex flex-column gap-2">
              <a th:href="@{/ajuste-curvas/regresion-lineal}" class="method-link"><i class="bi bi-graph-up"></i> Regresión Lineal <i class="bi bi-chevron-right arrow"></i></a>
              <a th:href="@{/ajuste-curvas/regresion-polinomial}" class="method-link"><i class="bi bi-graph-up-arrow"></i> Regresión Polinomial <i class="bi bi-chevron-right arrow"></i></a>
              <a th:href="@{/ajuste-curvas/regresion-multiple}" class="method-link"><i class="bi bi-layers"></i> Regresión Múltiple <i class="bi bi-chevron-right arrow"></i></a>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="p-3 rounded-3 h-100" style="border:1px solid var(--line);">
            <strong class="d-block mb-1"><i class="bi bi-bezier me-1" style="color:var(--muted);"></i> Interpolación</strong>
            <small class="d-block mb-3" style="color:var(--muted);">Pasa por los puntos</small>
            <div class="d-flex flex-column gap-2">
              <a th:href="@{/ajuste-curvas/diferencias-divididas}" class="method-link"><i class="bi bi-calculator"></i> Diferencias Divididas <i class="bi bi-chevron-right arrow"></i></a>
              <a th:href="@{/ajuste-curvas/lagrange}" class="method-link"><i class="bi bi-braces"></i> Lagrange (≤4º) <i class="bi bi-chevron-right arrow"></i></a>
            </div>
            <div class="small mt-3 font-mono p-2 rounded-2" style="background:var(--surface-2); border:1px solid var(--line); color:var(--muted);">P<sub>n</sub>(x) = Σ L<sub>i</sub>(x)·y<sub>i</sub></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
