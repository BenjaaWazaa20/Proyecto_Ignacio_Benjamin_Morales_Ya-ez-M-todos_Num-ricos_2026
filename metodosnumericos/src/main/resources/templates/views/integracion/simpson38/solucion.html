<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Solución - Simpson 3/8</title>
</head>
<body>
<section class="container my-4">

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4 animate-in">
        <div>
            <span class="section-kicker mb-2"><i class="bi bi-bezier"></i> Integración · Simpson 3/8</span>
            <h2 class="section-title mb-1" style="font-size:1.65rem;">Método de Simpson 3/8</h2>
            <p class="section-desc mb-0 small">Regla cúbica con ponderación 1 — 3 — 3 — 1 · n=3 por subintervalo</p>
        </div>
        <span class="badge-numerica badge-dark">3/8 parabólico</span>
    </div>

    <!-- Métricas -->
    <div class="row g-3 mb-4 animate-in">
        <div class="col-md-4">
            <div class="card-numerica h-100 text-center p-4">
                <div class="icon-bubble ib-indigo mx-auto mb-3"><i class="bi bi-bullseye"></i></div>
                <div class="label-numerica justify-content-center">Integral Exacta</div>
                <div class="font-mono fw-bold mt-2" style="font-size:1.25rem; word-break:break-word;" th:text="${respuesta.integralExacta}"></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="result-highlight h-100 text-center d-flex flex-column justify-content-center p-4">
                <div class="icon-bubble ib-emerald mx-auto mb-3"><i class="bi bi-check2-circle"></i></div>
                <div class="label-numerica justify-content-center" style="color:var(--primary-600);">Integral Aproximada</div>
                <div class="font-mono fw-bold mt-2" style="font-size:1.35rem; word-break:break-word;" th:text="${respuesta.integralAproximada}"></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card-numerica h-100 text-center p-4" style="border-color:rgba(244,63,94,.14);">
                <div class="icon-bubble ib-rose mx-auto mb-3"><i class="bi bi-graph-down"></i></div>
                <div class="label-numerica justify-content-center">Error Relativo</div>
                <div class="font-mono fw-bold mt-2" style="font-size:1.25rem; color:var(--rose);" th:text="${#numbers.formatDecimal(respuesta.errorRelativo, 1, 4)} + '%'"></div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <!-- Tabla -->
        <div class="col-md-5">
            <div class="card-numerica h-100 animate-in">
                <div class="card-header-numerica">
                    <div class="d-flex align-items-center gap-2">
                        <div class="icon-bubble ib-slate" style="width:36px;height:36px;"><i class="bi bi-table"></i></div>
                        <h5 class="mb-0 fw-bold" style="font-size:.95rem;">Puntos Evaluados (n=3)</h5>
                    </div>
                    <span class="badge-numerica badge-dark" th:text="${#lists.size(respuesta.tablaPuntos)} + ' pts'"></span>
                </div>
                <div class="p-3">
                    <div class="table-responsive">
                        <table class="table table-numerica text-center mb-0">
                            <thead>
                            <tr>
                                <th>i</th>
                                <th>xi</th>
                                <th>f(xi)</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="punto : ${respuesta.tablaPuntos}">
                                <td class="fw-bold font-mono" th:text="${#numbers.formatInteger(punto.i, 1)}"></td>
                                <td class="font-mono" th:text="${#numbers.formatDecimal(punto.x, 1, 4)}"></td>
                                <td class="font-mono cell-accent" th:text="${#numbers.formatDecimal(punto.fx, 1, 4)}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pasos -->
        <div class="col-md-7">
            <div class="card-numerica h-100 animate-in">
                <div class="card-header-numerica">
                    <div class="d-flex align-items-center gap-2">
                        <div class="icon-bubble ib-violet" style="width:36px;height:36px;"><i class="bi bi-journal-code"></i></div>
                        <h5 class="mb-0 fw-bold" style="font-size:.95rem;">Desarrollo Matemático</h5>
                    </div>
                    <span class="badge-numerica badge-primary" th:text="${#lists.size(respuesta.pasosDesarrollo)} + ' pasos'"></span>
                </div>
                <div class="card-body p-0">
                    <div class="code-block m-3" style="max-height:360px;">
                        <div th:each="paso,iter : ${respuesta.pasosDesarrollo}" class="d-flex gap-2 py-1" style="border-bottom:1px solid rgba(255,255,255,.06);">
                            <span class="text-white-50" style="min-width:28px;" th:text="${iter.index + 1} + '.'"></span>
                            <span th:text="${paso}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2 mt-4">
        <a th:href="@{/integracion/simpson38}" class="btn-numerica btn-ghost">
            <i class="bi bi-arrow-left"></i> Regresar al Formulario
        </a>
        <a th:href="@{/}" class="btn-numerica btn-primary-numerica ms-auto">
            <i class="bi bi-house"></i> Inicio
        </a>
    </div>

</section>
</body>
</html>
