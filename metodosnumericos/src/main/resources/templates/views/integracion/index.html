<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head><title>Integración Numérica — Numérica</title></head>
<body>
<section class="container" style="max-width:780px;">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
    <div>
      <div class="section-kicker mb-2"><i class="bi bi-integral"></i> Unidad VI</div>
      <h2 class="section-title mb-1" style="font-size:1.5rem;">Integración Numérica</h2>
      <p class="section-desc mb-0">Cuadratura para ∫ f(x) dx — trapecio y Simpson.</p>
    </div>
    <a th:href="@{/}" class="btn btn-numerica btn-ghost"><i class="bi bi-arrow-left"></i> Inicio</a>
  </div>

  <div class="card-numerica">
    <div class="card-header-numerica">
      <strong><i class="bi bi-bounding-box me-2" style="color:var(--muted);"></i> Métodos de Cuadratura</strong>
      <span class="badge-numerica badge-primary">4 métodos</span>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-sm-6"><a th:href="@{/integracion/trapecio}" class="method-link"><i class="bi bi-bounding-box"></i> Regla del Trapecio <i class="bi bi-chevron-right arrow"></i></a></div>
        <div class="col-sm-6"><a th:href="@{/integracion/simpson13}" class="method-link"><i class="bi bi-option"></i> Simpson 1/3 <i class="bi bi-chevron-right arrow"></i></a></div>
        <div class="col-sm-6"><a th:href="@{/integracion/simpson38}" class="method-link"><i class="bi bi-option"></i> Simpson 3/8 <i class="bi bi-chevron-right arrow"></i></a></div>
        <div class="col-sm-6"><a th:href="@{/integracion/multiple}" class="method-link"><i class="bi bi-layers"></i> Integración Múltiple <i class="bi bi-chevron-right arrow"></i></a></div>
      </div>
      <div class="mt-3 small font-mono p-2 rounded-2" style="background:var(--surface-2); border:1px solid var(--line); color:var(--muted);">∫ f(x) dx ≈ h/2 [f(a)+2Σf(x<sub>i</sub>)+f(b)]</div>
    </div>
  </div>
</section>
</body>
</html>
