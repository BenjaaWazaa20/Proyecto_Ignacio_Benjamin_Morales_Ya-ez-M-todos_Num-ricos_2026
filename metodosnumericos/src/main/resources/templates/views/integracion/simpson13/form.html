<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Método de Simpson 1/3</title>
</head>
<body>
<section class="container my-4 animate-in">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <div class="d-flex align-items-center gap-2 mb-3">
                <a th:href="@{/integracion}" class="btn-numerica btn-ghost py-2 px-3" style="text-decoration:none;font-size:.82rem">
                    <i class="bi bi-arrow-left"></i> Integración
                </a>
                <span class="text-muted" style="font-size:.82rem">/</span>
                <span class="badge-numerica badge-dark" style="font-size:.68rem">Simpson 1/3</span>
            </div>

            <div class="form-card">
                <div class="form-header">
                    <div class="d-flex align-items-center gap-3">
                        <div class="icon-bubble ib-cyan" style="width:48px;height:48px;border-radius:14px;font-size:1.35rem">
                            <i class="bi bi-intersect"></i>
                        </div>
                        <div>
                            <h3 class="mb-0" style="font-size:1.42rem">Simpson 1/3</h3>
                            <p class="mb-0">Integración compuesta — requiere n par.</p>
                        </div>
                    </div>
                </div>
                <div class="form-body">

                    <div th:if="${error}" class="alert-numerica alert-danger-numerica mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle-fill fs-5 flex-shrink-0"></i>
                        <div>
                            <strong class="d-block" style="font-size:.85rem">Error al procesar</strong>
                            <span th:text="${error}">Error</span>
                        </div>
                    </div>

                    <form th:action="@{/integracion/simpson13}" th:object="${simpson13Request}" method="post">
                        <div class="mb-3">
                            <label class="label-numerica"><i class="bi bi-braces"></i> Función f(x)</label>
                            <input type="text" class="form-control input-numerica font-mono" th:field="*{fx}" placeholder="Ej. x^2 + 2*x" required>
                            <div class="help-numerica"><i class="bi bi-info-circle"></i> Variable x. Permite potencias (^) y funciones trigonométricas.</div>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="label-numerica"><i class="bi bi-arrow-bar-left"></i> Límite inferior (a)</label>
                                <input type="number" step="any" class="form-control input-numerica font-mono text-center" th:field="*{a}" required placeholder="a">
                            </div>
                            <div class="col-md-4">
                                <label class="label-numerica"><i class="bi bi-arrow-bar-right"></i> Límite superior (b)</label>
                                <input type="number" step="any" class="form-control input-numerica font-mono text-center" th:field="*{b}" required placeholder="b">
                            </div>
                            <div class="col-md-4">
                                <label class="label-numerica"><i class="bi bi-segmented-nav"></i> Segmentos (n)</label>
                                <input type="number" class="form-control input-numerica font-mono text-center" th:field="*{n}" placeholder="Ej. 2, 4, 6..." required>
                                <div class="help-numerica" style="color:#dc2626"><i class="bi bi-exclamation-circle"></i> Debe ser par.</div>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-4 flex-wrap gap-2">
                            <a th:href="@{/integracion}" class="btn-numerica btn-ghost">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                            <button type="submit" class="btn-numerica btn-primary-numerica">
                                <i class="bi bi-calculator"></i> Resolver Simpson 1/3
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
