<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::section})}">
<head>
    <title>Diferenciación Numérica</title>
</head>
<body>
<section class="container my-4 animate-in">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <div class="d-flex align-items-center gap-2 mb-3">
                <a th:href="@{/derivacion}" class="btn-numerica btn-ghost py-2 px-3" style="text-decoration:none;font-size:.82rem">
                    <i class="bi bi-arrow-left"></i> Derivación
                </a>
                <span class="text-muted" style="font-size:.82rem">/</span>
                <span class="badge-numerica badge-dark" style="font-size:.68rem">Diferenciación</span>
            </div>

            <div class="form-card">
                <div class="form-header">
                    <div class="d-flex align-items-center gap-3">
                        <div class="icon-bubble ib-violet" style="width:48px;height:48px;border-radius:14px;font-size:1.35rem">
                            <i class="bi bi-activity"></i>
                        </div>
                        <div>
                            <h3 class="mb-0" style="font-size:1.42rem">Diferenciación Numérica</h3>
                            <p class="mb-0">Aproxima derivadas hasta 4.º orden por diferencias finitas.</p>
                        </div>
                    </div>
                </div>
                <div class="form-body">
                    <!-- Mensaje de error si ocurre -->
                    <div th:if="${error}" class="alert-numerica alert-danger-numerica mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle-fill fs-5 flex-shrink-0"></i>
                        <div>
                            <strong class="d-block" style="font-size:.85rem">Error al procesar</strong>
                            <span th:text="${error}">Error al procesar la solicitud</span>
                        </div>
                        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/derivacion/diferenciacion}" th:object="${derivacionRequest}" method="post">
                        <!-- Función f(x) -->
                        <div class="mb-3">
                            <label for="funcion" class="label-numerica"><i class="bi bi-braces"></i> Función F(x)</label>
                            <input type="text" class="form-control input-numerica font-mono" id="funcion" th:field="*{funcion}"
                                   placeholder="Ej: x^3 + 2*x^2 - x + 5" required />
                            <div class="help-numerica"><i class="bi bi-info-circle"></i> Soporta operadores básicos, funciones trigonométricas (Sin, Cos) y potencias (^).</div>
                        </div>

                        <div class="row g-3">
                            <!-- Punto x0 -->
                            <div class="col-md-6">
                                <label for="x" class="label-numerica"><i class="bi bi-crosshair"></i> Valor del punto (X₀)</label>
                                <input type="number" step="any" class="form-control input-numerica font-mono text-center" id="x" th:field="*{x}" required placeholder="Ej. 1.5" />
                            </div>

                            <!-- Incremento h -->
                            <div class="col-md-6">
                                <label for="h" class="label-numerica"><i class="bi bi-arrows-expand"></i> Tamaño de paso (h)</label>
                                <input type="number" step="any" class="form-control input-numerica font-mono text-center" id="h" th:field="*{h}" required placeholder="Ej. 0.01" />
                                <div class="help-numerica"><i class="bi bi-lightbulb"></i> Valores pequeños mejoran precisión.</div>
                            </div>
                        </div>

                        <!-- Orden de la derivada -->
                        <div class="mt-3 mb-4">
                            <label class="label-numerica"><i class="bi bi-layers"></i> Orden de la derivada</label>
                            <select class="form-select input-numerica" th:field="*{ordenDerivada}" required>
                                <option value="1">1.er Orden: Primera derivada f'(x)</option>
                                <option value="2">2.º Orden: Segunda derivada f''(x)</option>
                                <option value="3">3.er Orden: Tercera derivada f'''(x)</option>
                                <option value="4">4.º Orden: Cuarta derivada f⁴(x)</option>
                            </select>
                        </div>

                        <!-- Botones de Acción -->
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <a th:href="@{/derivacion}" class="btn-numerica btn-ghost">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                            <button type="submit" class="btn-numerica btn-primary-numerica">
                                <i class="bi bi-check-lg"></i> Resolver derivada
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
