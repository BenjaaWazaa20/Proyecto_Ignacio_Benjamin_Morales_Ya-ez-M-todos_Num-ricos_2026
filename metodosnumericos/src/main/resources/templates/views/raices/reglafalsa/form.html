<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragments/base :: html(title='Método de Regla Falsa', content=~{::section})}">
<body>
    <section>
        <div class="container mt-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Método de Regla Falsa</h4>
                </div>
                <div class="card-body">
                    <!-- Formulario con envío POST hacia /raices/regla-falsa -->
                    <form th:action="@{/raices/regla-falsa}" th:object="${reglaFalsa}" method="post">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="xl" class="form-label fw-bold">Valor de XL</label> <!--[cite: 2] -->
                                <input type="number" step="any" class="form-control" id="xl" th:field="*{xl}" required> <!--[cite: 2] -->
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="xu" class="form-label fw-bold">Valor de XU</label> <!--[cite: 2] -->
                                <input type="number" step="any" class="form-control" id="xu" th:field="*{xu}" required> <!--[cite: 2] -->
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="fx" class="form-label fw-bold">Función FX</label> <!--[cite: 2] -->
                            <input type="text" class="form-control" id="fx" th:field="*{fx}" placeholder="Ej: x^3 - 2*x - 5" required> <!--[cite: 2] -->
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="er" class="form-label fw-bold">Error relativo aprox.</label> <!--[cite: 2] -->
                                <input type="number" step="any" class="form-control" id="er" th:field="*{er}" required> <!--[cite: 2] -->
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="maximoIteraciones" class="form-label fw-bold">Máximo de iteraciones</label> <!--[cite: 2] -->
                                <input type="number" class="form-control" id="maximoIteraciones" th:field="*{maximoIteraciones}" required> <!--[cite: 2] -->
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-success me-2">Resolver</button> <!--[cite: 2] -->
                            <a th:href="@{/raices}" class="btn btn-secondary">Cancelar</a> <!--[cite: 2] -->
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
