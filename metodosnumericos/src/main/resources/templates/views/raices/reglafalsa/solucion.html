<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragments/base :: html(title='Solución - Regla Falsa', content=~{::section})}">
<body>
    <section>
        <div class="container mt-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Resultados - Método de Regla Falsa</h4>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover table-bordered text-center align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Iteración</th> <!-- -->
                                    <th>XL</th> <!-- -->
                                    <th>XU</th> <!-- -->
                                    <th>XR</th> <!-- -->
                                    <th>FXL</th> <!--[cite: 2] -->
                                    <th>FXU</th> <!--[cite: 2] -->
                                    <th>FXR</th> <!--[cite: 2] -->
                                    <th>Error relativo (%)</th> <!--[cite: 2] -->
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="row : ${iteraciones}">
                                    <td th:text="${row.iteracion}"></td>
                                    <td th:text="${#numbers.formatDecimal(row.xl, 1, 6)}"></td>
                                    <td th:text="${#numbers.formatDecimal(row.xu, 1, 6)}"></td>
                                    <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(row.xr, 1, 6)}"></td>
                                    <td th:text="${#numbers.formatDecimal(row.fxl, 1, 6)}"></td>
                                    <td th:text="${#numbers.formatDecimal(row.fxu, 1, 6)}"></td>
                                    <td th:text="${#numbers.formatDecimal(row.fxr, 1, 6)}"></td>
                                    <td th:text="${#numbers.formatDecimal(row.er, 1, 6)}"></td>
                                </tr>
                                <tr th:if="${#arrays.isEmpty(iteraciones)}">
                                    <td colspan="8" class="text-danger">No se obtuvieron iteraciones o la función no converge en el intervalo.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="mt-4">
                        <a th:href="@{/raices}" class="btn btn-secondary">Regresar</a> <!--[cite: 2] -->
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
