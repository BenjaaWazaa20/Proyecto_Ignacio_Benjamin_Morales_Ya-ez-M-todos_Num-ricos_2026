<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{fragments/base :: html(title='Método de la Secante Modificada', content=~{::section})}">
<body>
    <section>
        <div class="container mt-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Método de Iteración de la Secante Modificada</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/raices/secante-modificada}" th:object="${secanteModificada}" method="post">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="x0" class="form-label fw-bold">Valor inicial X0</label>
                                <input type="number" step="any" class="form-control" id="x0" th:field="*{x0}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="fx" class="form-label fw-bold">Función F(X)</label>
                                <input type="text" class="form-control" id="fx" th:field="*{fx}" 
                                       placeholder="Ej: x^3 - 2*x - 5" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="Sigma" class="form-label fw-bold">Sigma</label>
                                <input type="number" step="any" class="form-control" id="Sigma" th:field="*{Sigma}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="er" class="form-label fw-bold">Error relativo aprox.</label>
                                <input type="number" step="any" class="form-control" id="er" th:field="*{er}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="maximoIteraciones" class="form-label fw-bold">Máximo de iteraciones</label>
                                <input type="number" class="form-control" id="maximoIteraciones" th:field="*{maximoIteraciones}" required>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-success me-2">Resolver</button>
                            <a th:href="@{/raices}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
