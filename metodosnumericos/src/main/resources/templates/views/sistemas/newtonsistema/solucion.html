<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: html(title='Solución Newton-Raphson Sistemas', content=~{::section})}">
<body>
<section class="container mt-4">
    <h2 class="mb-4">Resultados: Newton-Raphson (Sistemas No Lineales)</h2>


    <div th:if="${!resultado.convergio}" class="alert alert-warning">
        <h5 class="alert-heading">Atención</h5>
        <p th:text="${resultado.mensajeError != null ? resultado.mensajeError : 'No se alcanzó la convergencia en el límite de iteraciones.'}"></p>
        <hr>
        <p class="mb-0"><strong>Última aproximación X:</strong> <span th:text="${resultado.XFinal}"></span></p>
        <p class="mb-0"><strong>Última aproximación Y:</strong> <span th:text="${resultado.YFinal}"></span></p>
    </div>

    <!-- Tabla de iteraciones -->
    <div class="table-responsive mt-4">
        <table class="table table-bordered table-striped table-hover text-center">
            <thead class="table-dark">
                <tr>
                    <th>Iteración</th>
                    <th>Xi</th>
                    <th>Yi</th>
                    <th>Xi+1</th>
                    <th>Yi+1</th>
                    <th>Ui</th>
                    <th>Vi</th>
                    <th>dU/dx</th>
                    <th>dU/dy</th>
                    <th>dV/dx</th>
                    <th>dV/dy</th>
                    <th>Jacobiano</th>
                    <th>Erx (%)</th>
                    <th>Ery (%)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="fila : ${resultado.historial}">
                    <td th:text="${fila.iteracion}"></td>
                    <td th:text="${#numbers.formatDecimal(fila.xi, 1, 6)}"></td>
                    <td th:text="${#numbers.formatDecimal(fila.yi, 1, 6)}"></td>
                    <td th:text="${#numbers.formatDecimal(fila.xiNuevo, 1, 6)}"></td>
                    <td th:text="${#numbers.formatDecimal(fila.yiNuevo, 1, 6)}"></td>
                    <td th:text="${#numbers.formatDecimal(fila.ui, 1, 6)}"></td>
                    <td th:text="${#numbers.formatDecimal(fila.vi, 1, 6)}"></td>
                    <td th:text="${#numbers.formatDecimal(fila.duDx, 1, 6)}"></td>
                    <td th:text="${#numbers.formatDecimal(fila.duDy, 1, 6)}"></td>
                    <td th:text="${#numbers.formatDecimal(fila.dvDx, 1, 6)}"></td>
                    <td th:text="${#numbers.formatDecimal(fila.dvDy, 1, 6)}"></td>
                    <td th:text="${#numbers.formatDecimal(fila.jacobiano, 1, 6)}"></td>
                    <td th:text="${#numbers.formatDecimal(fila.errorX, 1, 6)}"></td>
                    <td th:text="${#numbers.formatDecimal(fila.errorY, 1, 6)}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <a th:href="@{/sistemas}" class="btn btn-secondary">Regresar</a>
    </div>
</section>
</body>
</html>
