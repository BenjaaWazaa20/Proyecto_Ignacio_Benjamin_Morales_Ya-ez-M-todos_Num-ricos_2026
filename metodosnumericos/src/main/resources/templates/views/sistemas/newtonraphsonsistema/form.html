<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: html(title='Newton-Raphson Sistemas', content=~{::section})}">
<body>
<section>
    <div class="container mt-5 shadow-sm p-4 bg-white rounded">
        <h2 class="mb-4 text-primary">Método de Newton-Raphson (Sistemas No Lineales)</h2>
        <p class="text-muted">Introduce el sistema de ecuaciones de la forma U(x,y) = 0 y V(x,y) = 0. Las derivadas parciales (Jacobiano) se calcularán automáticamente.</p>
        
        <form th:action="@{/sistemas/newton-raphson}" th:object="${newtonSistema}" method="post">
            
            <div class="row mb-4">
                <div class="col-md-6">
                    <label for="u" class="form-label fw-bold">Ecuación U(x,y) = 0</label>
                    <input type="text" class="form-control font-monospace" id="u" th:field="*{u}" placeholder="Ej. x^2 + x*y - 10" required>
                </div>
                <div class="col-md-6">
                    <label for="v" class="form-label fw-bold">Ecuación V(x,y) = 0</label>
                    <input type="text" class="form-control font-monospace" id="v" th:field="*{v}" placeholder="Ej. 3*x*y^2 + y - 57" required>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-3">
                    <label for="x0" class="form-label">Aproximación X0</label>
                    <input type="number" step="any" class="form-control" id="x0" th:field="*{x0}" required>
                </div>
                <div class="col-md-3">
                    <label for="y0" class="form-label">Aproximación Y0</label>
                    <input type="number" step="any" class="form-control" id="y0" th:field="*{y0}" required>
                </div>
                <div class="col-md-3">
                    <label for="er" class="form-label">Tolerancia Error (%)</label>
                    <input type="number" step="any" class="form-control" id="er" th:field="*{er}" value="0.001" required>
                </div>
                <div class="col-md-3">
                    <label for="maximoIteraciones" class="form-label">Límite Iteraciones</label>
                    <input type="number" class="form-control" id="maximoIteraciones" th:field="*{maximoIteraciones}" value="50" required>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-calculator"></i> Resolver Sistema
                </button>
                <a th:href="@{/sistemas}" class="btn btn-outline-secondary px-4">Cancelar</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
