<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: html(title='Solución Punto Fijo', content=~{::section})}">
<body>
    <section class="container mt-5">
        <h2 class="mb-4">Solución: Iteración de Punto Fijo (Sistemas)</h2>

        <div th:if="${resultado.convergio}" class="alert alert-success" role="alert">
            <h4 class="alert-heading">¡Convergencia alcanzada!</h4>
            <p>Se ha encontrado una solución aproximada al sistema:</p>
            <hr>
            <p class="mb-0">
                <strong>X Final:</strong> <span th:text="${resultado.xFinal}"></span> <br>
                <strong>Y Final:</strong> <span th:text="${resultado.yFinal}"></span>
            </p>
        </div>

        <div th:unless="${resultado.convergio}" class="alert alert-warning" role="alert">
            <h4 class="alert-heading">Advertencia</h4>
            <p th:text="${resultado.mensajeError}"></p>
            <hr>
            <p class="mb-0">
                <em>Última aproximación calculada:</em><br>
                <strong>X:</strong> <span th:text="${resultado.xFinal}"></span> <br>
                <strong>Y:</strong> <span th:text="${resultado.yFinal}"></span>
            </p>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-bordered text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Iteración</th>
                        <th>X</th>
                        <th>Y</th>
                        <th>u(X,Y)</th>
                        <th>v(X,Y)</th>
                        <th>Er(x) %</th>
                        <th>Er(y) %</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="fila : ${resultado.historial}">
                        <td th:text="${fila.iteracion}"></td>
                        <td th:text="${fila.x}"></td>
                        <td th:text="${fila.y}"></td>
                        <td th:text="${fila.xNuevo}"></td>
                        <td th:text="${fila.yNuevo}"></td>
                        <td th:text="${#numbers.formatDecimal(fila.errorX, 1, 4)}"></td>
                        <td th:text="${#numbers.formatDecimal(fila.errorY, 1, 4)}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-4 mb-5">
            <!-- 27.1: Botón de regresar[cite: 3] -->
            <a th:href="@{/sistemas}" class="btn btn-secondary">Regresar</a>
        </div>
    </section>
</body>
</html>
