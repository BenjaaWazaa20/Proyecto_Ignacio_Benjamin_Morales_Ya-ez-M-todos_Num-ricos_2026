<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: html(title='Gauss-Seidel', content=~{::section})}"> 
<body>
<section>
    <div class="container mt-5">
        <h2>Método de Gauss-Seidel</h2>
        
        <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
        
        <form th:action="@{/sistemas/gauss-seidel}" th:object="${sistemaIterativo}" method="post" id="gaussSeidelForm"> <!--[cite: 3] -->
            
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="tamano" class="form-label">Tamaño del sistema (n x n)</label> <!--[cite: 3] -->
                    <select class="form-select" id="tamano" th:field="*{tamano}" onchange="generarCuadricula()">
                        <option value="2">2</option> <!--[cite: 3] -->
                        <option value="3">3</option> <!--[cite: 3] -->
                        <option value="4">4</option> <!--[cite: 3] -->
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="er" class="form-label">Error relativo aprox. (%)</label> <!--[cite: 3] -->
                    <input type="number" step="any" class="form-control" th:field="*{er}" required> <!--[cite: 3] -->
                </div>
                <div class="col-md-4">
                    <label for="maxIters" class="form-label">Máximo de iteraciones</label> <!--[cite: 3] -->
                    <input type="number" class="form-control" th:field="*{maximoIteraciones}" required> <!--[cite: 3] -->
                </div>
            </div>

            <div id="gridContainer" class="mb-4 overflow-auto"></div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Resolver por Gauss-Seidel</button> <!--[cite: 3] -->
                <a th:href="@{/sistemas}" class="btn btn-secondary">Cancelar</a> <!--[cite: 3] -->
            </div>
        </form>
    </div>

    <!-- Generación dinámica de la matriz, vector independiente y valores iniciales con JavaScript[cite: 3] -->
    <script>
        function generarCuadricula() {
            const tamano = parseInt(document.getElementById('tamano').value);
            const container = document.getElementById('gridContainer');
            let html = '<table class="table table-bordered text-center align-middle"><thead><tr><th colspan="'+tamano+'">Matriz de Coeficientes (A)</th><th>Términos independientes (b)</th><th>Aproximación inicial X0</th></tr></thead><tbody>';

            for (let i = 0; i < tamano; i++) {
                html += '<tr>';
                // Generar columnas de la Matriz A
                for (let j = 0; j < tamano; j++) {
                    html += `<td><input type="number" step="any" class="form-control" name="matriz[${i}][${j}]" placeholder="a${i+1}${j+1}" required></td>`;
                }
                // Generar columna del Vector b[cite: 3]
                html += `<td><input type="number" step="any" class="form-control" name="vector[${i}]" placeholder="b${i+1}" required></td>`;
                // Generar columna del Valor Inicial X0[cite: 3]
                html += `<td><input type="number" step="any" class="form-control" name="valoresIniciales[${i}]" placeholder="x0_${i+1}" required></td>`;
                html += '</tr>';
            }
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // Inicializar al cargar
        document.addEventListener('DOMContentLoaded', generarCuadricula);
    </script>
</section>
</body>
</html>
