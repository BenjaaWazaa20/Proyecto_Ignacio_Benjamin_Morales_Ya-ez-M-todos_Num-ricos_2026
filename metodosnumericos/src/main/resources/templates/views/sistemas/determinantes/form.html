<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: html(title='Determinantes - Sistemas Lineales', content=~{::section})}">
<body>
<section>
    <div class="container mt-4">
        <h3>Resolución por Determinantes (Regla de Cramer)</h3>
        
        <form th:action="@{/sistemas/determinantes}" th:object="${sistemaLineal}" method="post">
            <!-- Selector de Tamaño -->
            <div class="mb-3 w-50">
                <label for="tamano" class="form-label">Tamaño del sistema (n x n)</label>
                <select class="form-select" id="tamano" th:field="*{tamano}" onchange="generarCuadricula()" required>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>

            <!-- Contenedor dinámico para la Matriz A y el Vector B -->
            <div id="matriz-container" class="mt-4 row">
                <!-- Se inyecta vía JS -->
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Resolver por Determinantes</button>
                <a th:href="@{/sistemas}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

    <!-- Script de generación dinámica -->
    <script th:inline="javascript">
        function generarCuadricula() {
            const tamanoSelect = document.getElementById('tamano').value;
            const container = document.getElementById('matriz-container');
            const n = parseInt(tamanoSelect);
            
            if (isNaN(n) || n < 2 || n > 4) {
                container.innerHTML = '';
                return;
            }

            let html = '<div class="col-md-8"><h5>Matriz de Coeficientes (A)</h5>';
            for (let i = 0; i < n; i++) {
                html += '<div class="row mb-2">';
                for (let j = 0; j < n; j++) {
                    html += `
                        <div class="col">
                            <label class="form-label small">a${i+1}${j+1}</label>
                            <input type="number" step="any" class="form-control" name="matriz[${i}][${j}]" required />
                        </div>`;
                }
                html += '</div>';
            }
            html += '</div>';

            html += '<div class="col-md-4"><h5>Términos independientes (b)</h5>';
            for (let i = 0; i < n; i++) {
                html += `
                    <div class="mb-2">
                        <label class="form-label small">b${i+1}</label>
                        <div class="row"><div class="col" style="margin-top: ${i === 0 ? '0' : '8px'};"> 
                            <input type="number" step="any" class="form-control" name="vector[${i}]" required />
                        </div></div>
                    </div>`;
            }
            html += '</div>';

            container.innerHTML = html;
        }

        // Genera la cuadrícula automáticamente al cargar, ya que "2" queda seleccionado por defecto
        document.addEventListener("DOMContentLoaded", function() {
            generarCuadricula();
        });
    </script>
</section>
</body>
</html>
